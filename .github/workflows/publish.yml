name: Publish

# Stages @ingredient-icons/core when a GitHub release is published: a maintainer
# then approves it on npmjs.com or with `npm stage approve`, with 2FA.
# Authenticates with npm Trusted Publishing (OIDC): no npm token is stored here.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: npm stage publish
        working-directory: packages/core
